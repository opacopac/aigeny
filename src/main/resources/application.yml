spring:
  application:
    name: AIgeny
  # Load optional external config from ~/.aigeny/aigeny.yml (overrides everything below)
  config:
    import: "optional:file:${user.home}/.aigeny/aigeny.yml"
  mvc:
    async:
      request-timeout: 300000   # 5 min – Ollama on CPU can be slow

server:
  port: 8080

# ── AIgeny configuration ──────────────────────────────────────────────────────
# Override via environment variables (Spring Boot auto-mapping):
#   aigeny.llm.api-key               →  AIGENY_LLM_API_KEY
#   aigeny.db.stages.inte.password   →  AIGENY_DB_STAGES_INTE_PASSWORD
# Or use Docker-secret _FILE variants:
#   AIGENY_LLM_API_KEY_FILE=/run/secrets/llm_api_key
#   AIGENY_DB_PASSWORD_FILE=/run/secrets/db_password   (applies to the aigeny.db.default-stage stage only)
#
# ── Supported LLM providers ───────────────────────────────────────────────────
#
#  provider         adapter              notes
#  ───────────────  ───────────────────  ──────────────────────────────────────
#  claude           AnthropicAdapter     native Anthropic API
#  github-copilot   GitHubCopilotAdapter OAuth device-flow; no api-key needed
#  openai           OpenAiCompatibleAdapter
#  ollama           OpenAiCompatibleAdapter  local, base-url: http://localhost:11434/v1
#  azure            OpenAiCompatibleAdapter
#  groq             OpenAiCompatibleAdapter  free cloud tier, rate-limited
#  grok             OpenAiCompatibleAdapter  xAI Grok
#  <anything else>  OpenAiCompatibleAdapter  fallback
#
# ─────────────────────────────────────────────────────────────────────────────
aigeny:
  # ── Default LLM – override in ~/.aigeny/aigeny.yml or via env vars ──────────
  llm:
    provider: github-copilot
    model: claude-sonnet-4.6
    max-tokens: 32000   # output tokens per LLM response; raise if empty responses occur with reasoning models

  #llm:
  #  provider: claude
  #  api-key: ""
  #  base-url: https://api.anthropic.com/v1
  #  model: claude-sonnet-4-6

  db:
    # Per-stage Oracle connection details - each stage is an entirely separate Oracle
    # instance/account, so url/username/password/schema are all configured per stage. Add as
    # many stages as needed (this is not limited to INTE/PROD - e.g. TEST/DEV work the same way,
    # with no code change). The stage names below (INTE/PROD) are just examples with blank
    # placeholders; configure the actual values ONLY in your local ~/.aigeny/aigeny.yml
    # (never commit real hostnames/credentials into this file):
    #
    # aigeny:
    #   db:
    #     stages:
    #       INTE:
    #         url: "jdbc:oracle:thin:@inte-host:1521/SERVICENAME"
    #         username: "readonly_user"
    #         password: ""   # or AIGENY_DB_PASSWORD_FILE for Docker secrets (applies to default-stage only)
    #         schema: ""     # optional: Oracle schema if different from username
    #       PROD:
    #         url: "jdbc:oracle:thin:@prod-host:1521/SERVICENAME"
    #         username: "readonly_user"
    #         password: ""
    #         schema: ""
    stages:
      INTE:
        url: ""
        username: ""
        password: ""
        schema: ""
      PROD:
        url: ""
        username: ""
        password: ""
        schema: ""
    # Every list_tables/describe_table/search_schema/sample_table/run_query tool call now carries
    # two mandatory string arguments, "context" and "stage" - these defaults are used whenever
    # the caller omits them:
    #  - context: currently only this configured value is accepted; any other value is rejected
    #    by the MCP server with a "context not available" error.
    #  - stage: selects which entry of "stages" above is used for the DB connection. An
    #    unconfigured/unknown stage (or one with a blank url) is rejected with a
    #    "stage not available" error.
    default-context: pflege
    default-stage: INTE
    # The list_tables/describe_table/search_schema/sample_table/run_query tools are served
    # by an MCP server. By default (mcp-server-url blank) that server is the embedded
    # com.tschanz.aigeny.database.mcp_server.OracleMcpServerLauncher, launched as a local
    # stdio child process (see com.tschanz.aigeny.database.mcp_client.OracleMcpConnection).
    # Set mcp-server-url to switch to an independently deployed/remote MCP server instead
    # (Streamable HTTP MCP transport) - no other code change needed.
    mcp-server-url: ""   # e.g. https://mcp-host/mcp
    # Optional extra HTTP headers sent with every request to that remote MCP server,
    # e.g. an auth header/API key. Ignored for the local stdio subprocess.
    mcp-server-headers: {}
    #  X-API-Key: "secret"

  jira:
    base-url: ""   # e.g. https://jira.example.com  – token entered via UI

  bitbucket:
    base-url: ""   # e.g. https://code.example.com   – token entered via UI

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.tschanz.aigeny: DEBUG
    com.zaxxer.hikari: WARN
  file:
    name: ${user.home}/.aigeny/aigeny.log

